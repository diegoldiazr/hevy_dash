version: '3'

services:
  app:
    build: .
    image: diegoldiazr/hevy_dash:latest
    container_name: hevy-dash
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
